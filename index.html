<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d3140" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TripNest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TripNest</title>
    <script>
      /* Apply the saved theme and text size before anything is drawn, so there is no flash. (Same rules as src/api/prefs.ts.) */
      try {
        var p = JSON.parse(localStorage.getItem('tripnest:prefs') || '{}');
        if (p.theme === 'light' || p.theme === 'dark') document.documentElement.setAttribute('data-theme', p.theme);
        var pct = { small: 90, large: 115, xlarge: 130 }[p.textSize];
        if (pct) document.documentElement.style.fontSize = pct + '%';
      } catch (e) { /* storage unavailable: defaults */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
